name: Lint workflows
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
permissions:
  contents: read
jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install actionlint
        # Download script for the pinned release; the script verifies the
        # release asset checksums as part of the download.
        shell: bash
        run: bash <(curl --fail --silent --show-error --location https://raw.githubusercontent.com/rhysd/actionlint/1.7.12/scripts/download-actionlint.bash) 1.7.12
      - name: Lint workflow files
        run: ./actionlint -color
