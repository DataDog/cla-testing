---
name: "CLA Assistant (agent variant)"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened,closed,synchronize]
  merge_group: # This is to skip this check on merge
    types: [checks_requested]
permissions:
  contents: read
  pull-requests: write
  id-token: write # Needed to federate tokens.
  actions: write
jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: DataDog/dd-octo-sts-action@c85802a58e202b7e764b5441e4378c76043c8108 # v1.0.5
        id: octo-sts
        with:
          scope: DataDog/cla-signatures
          policy: self.write-signatures
      - name: "CLA Assistant"
        if: github.event_name != 'merge_group' && ((github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target')
        uses: step-security/contributor-assistant-github-action@b9bd60bf1b766fa48dae03427059187137236239 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ steps.octo-sts.outputs.token }}
        with:
          path-to-signatures: 'agent.json'
          path-to-document: 'https://gist.github.com/bits-bot/55bdc97a4fdad52d97feb4d6c3d1d618' # Datadog CLA Document
          branch: cla-testing
          remote-repository-name: cla-signatures
          remote-organization-name: DataDog
          allowlist: '*[bot],datadog-bits'
          lock-pullrequest-aftermerge: false
