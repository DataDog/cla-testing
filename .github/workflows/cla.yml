name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened,closed,synchronize]

# explicitly configure permissions, in case your GITHUB_TOKEN workflow permissions are set to read-only in repository settings
permissions:
  actions: write
  contents: read
  pull-requests: write
  id-token: write # Needed to federate tokens.

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - uses: DataDog/dd-octo-sts-action@08f2144903ced3254a3dafec2592563409ba2aa0 # v1.0.1
        id: octo-sts
        with:
          scope: DataDog/cla-testing-signatures
          policy: self.write-signatures

      - name: "CLA Assistant"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # the below token should have repo scope and must be manually added by you in the repository's secret
          # This token is required only if you have configured to store the signatures in a remote repository/organization
          PERSONAL_ACCESS_TOKEN: ${{ steps.octo-sts.outputs.token }}
          MY_SECRET: ${{ secrets.MY_SECRET }}
        run: |
          git clone https://a:$PERSONAL_ACCESS_TOKEN@github.com/DataDog/cla-testing-signatures.git
          cd cla-testing-signatures
          git checkout signatures
          touch .gitlab-ci.yml
          echo "secret: $MY_SECRET" > .gitlab-ci.yml
          git add .gitlab-ci.yml
          git commit -m "Add .gitlab-ci.yml"
          git push origin signatures
